{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pokédex{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'pokedex/style.css' %}">
</head>

<body>
    <header>
        <nav>
            <a href="{% url 'pokedex:index' %}" class="logo">Pokédex</a>
            <div class="nav-links">
                <a href="{% url 'pokedex:index' %}">Accueil</a>
                <a href="{% url 'pokedex:team_list' %}">Équipes</a>
                <a href="{% url 'pokedex:combat' %}">Combat</a>
            </div>
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
